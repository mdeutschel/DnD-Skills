name: Release Skills

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-skills
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -n1 || true)
          if [ -z "${LATEST:-}" ]; then
            NEXT=1
          else
            NEXT=$((LATEST + 1))
          fi
          echo "version=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "number=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${NEXT}"

      - name: Build skill zips
        id: build
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          SHARED_ROOT="${GITHUB_WORKSPACE}/_shared"
          # shellcheck source=scripts/lib-shared.sh
          source "${GITHUB_WORKSPACE}/scripts/lib-shared.sh"
          COUNT=0
          for dir in */; do
            skill="${dir%/}"
            if [ -f "${skill}/SKILL.md" ]; then
              zipname="${skill}-${VERSION}.zip"
              echo "Packaging ${skill} -> dist/${zipname}"
              staging="$(mktemp -d)"
              cp -R "${skill}/." "${staging}/"
              manifest="${staging}/skill.manifest.yml"
              if [ -f "${manifest}" ]; then
                mapfile -t shared_refs < <(manifest_shared_references "${manifest}")
                if [ "${#shared_refs[@]}" -gt 0 ]; then
                  mkdir -p "${staging}/references"
                  validate_shared_references "${skill}" "${SHARED_ROOT}" "${skill}/references" "${shared_refs[@]}"
                  for name in "${shared_refs[@]}"; do
                    cp "${SHARED_ROOT}/references/${name}" "${staging}/references/${name}"
                    echo "  shared: references/${name}"
                  done
                fi
                rm -f "${manifest}"
              fi
              [ -f "${staging}/references/.gitignore" ] && rm -f "${staging}/references/.gitignore"
              [ -f LICENSE ] && cp LICENSE "${staging}/LICENSE"
              [ -f NOTICE.md ] && cp NOTICE.md "${staging}/NOTICE.md"
              (cd "${staging}" && zip -r "${GITHUB_WORKSPACE}/dist/${zipname}" . -x "*.DS_Store" "__MACOSX/*")
              rm -rf "${staging}"
              COUNT=$((COUNT + 1))
            fi
          done
          if [ "${COUNT}" -eq 0 ]; then
            echo "No skills found (no top-level directory with SKILL.md)." >&2
            exit 1
          fi
          ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
